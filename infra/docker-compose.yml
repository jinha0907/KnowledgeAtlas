services:
  db:
    image: pgvector/pgvector:pg16
    container_name: projectkg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectkg}
      POSTGRES_USER: ${POSTGRES_USER:-projectkg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectkg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectkg} -d ${POSTGRES_DB:-projectkg}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
