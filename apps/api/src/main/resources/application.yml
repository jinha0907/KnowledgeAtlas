spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectkg}
    username: ${SPRING_DATASOURCE_USERNAME:projectkg}
    password: ${SPRING_DATASOURCE_PASSWORD:projectkg}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

notion:
  base-url: ${NOTION_BASE_URL:https://api.notion.com/v1}
  token: ${NOTION_TOKEN:}
  version: ${NOTION_VERSION:2022-06-28}

embedding:
  provider: ${EMBEDDING_PROVIDER:none}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    dimensions: ${OLLAMA_EMBEDDING_DIMENSIONS:1024}

decision-extraction:
  provider: ${DECISION_EXTRACTION_PROVIDER:none}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_DECISION_MODEL:gpt-4.1-mini}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_DECISION_MODEL:qwen3:4b}

document-analysis:
  provider: ${DOCUMENT_ANALYSIS_PROVIDER:none}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_DOCUMENT_ANALYSIS_MODEL:gpt-4.1-mini}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_DOCUMENT_ANALYSIS_MODEL:qwen3:4b}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
