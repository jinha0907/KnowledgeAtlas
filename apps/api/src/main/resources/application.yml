spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectkg}
    username: ${SPRING_DATASOURCE_USERNAME:projectkg}
    password: ${SPRING_DATASOURCE_PASSWORD:projectkg}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

notion:
  base-url: ${NOTION_BASE_URL:https://api.notion.com/v1}
  token: ${NOTION_TOKEN:}
  version: ${NOTION_VERSION:2022-06-28}
